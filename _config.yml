locale: en-US
site_theme: default
title: Boqiao Li
title_separator: '-'
name: Boqiao Li
description: Research in large language models, vision-language models, and autonomous
  driving. Notes on research, learning, and life.
url: https://liboqiao1234.github.io
baseurl: ''
repository: liboqiao1234/liboqiao1234.github.io
author:
  avatar: profile.jpg
  name: Boqiao Li / 李泊桥
  bio: LLM · VLM · Autonomous Driving
  location: China
  employer: Beihang University
  email: liboqiao2004@gmail.com
  github: liboqiao1234
  linkedin: boqiao-li
publication_category:
  books:
    title: Books
  manuscripts:
    title: Journal Articles
  conferences:
    title: Conference Papers
teaser: null
breadcrumbs: false
words_per_minute: 160
future: false
read_more: disabled
talkmap_link: false
comments:
  provider: false
  disqus:
    shortname: null
  discourse:
    server: null
  facebook:
    appid: null
    num_posts: null
    colorscheme: null
staticman:
  allowedFields:
  - name
  - email
  - url
  - message
  branch: gh-pages
  commitMessage: New comment.
  filename: comment-{@timestamp}
  format: yml
  moderation: true
  path: _data/comments/{options.slug}
  requiredFields:
  - name
  - email
  - message
  transforms:
    email: md5
  generatedFields:
    date:
      type: date
      options:
        format: iso8601
atom_feed:
  hide: true
  path: null
google_site_verification: null
bing_site_verification: null
alexa_site_verification: null
yandex_site_verification: null
twitter:
  username: null
facebook:
  username: null
  app_id: null
  publisher: null
og_image: null
og_description: null
social:
  type: null
  name: null
  links: null
analytics:
  provider: false
  google:
    tracking_id: null
include:
- .htaccess
- _pages
- files
exclude:
- '*.sublime-project'
- '*.sublime-workspace'
- .asset-cache
- .bundle
- .github
- .jekyll-assets-cache
- .sass-cache
- assets/js/_main.js
- assets/js/plugins
- assets/js/vendor
- CHANGELOG
- Capfile
- config
- Dockerfile
- Gemfile
- Gruntfile.js
- gulpfile.js
- LICENSE
- local
- log
- node_modules
- package.json*
- Rakefile
- README
- tmp
- vendor
- AGENTS.md
- LICENSE-academicpages
- Gemfile.lock
- docs
- scripts
- migration-report.json
keep_files:
- .git
- .svn
encoding: utf-8
markdown_ext: markdown,mkdown,mkdn,mkd,md
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: '


  '
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
defaults:
- scope:
    path: ''
    type: posts
  values:
    layout: single
    author_profile: true
    read_time: true
    comments: false
    share: false
    related: true
- scope:
    path: ''
    type: pages
  values:
    layout: single
    author_profile: true
    comments: false
    share: false
- scope:
    path: ''
    type: teaching
  values:
    layout: single
    author_profile: true
    share: false
    comments: false
- scope:
    path: ''
    type: publications
  values:
    layout: single
    author_profile: true
    share: false
    comments: false
- scope:
    path: ''
    type: portfolio
  values:
    layout: single
    author_profile: true
    share: false
    comment: true
    comments: false
- scope:
    path: ''
    type: talks
  values:
    layout: talk
    author_profile: true
    share: false
    comments: false
sass:
  sass_dir: _sass
  style: compressed
permalink: /blog/:year/:month/:title/
timezone: Asia/Shanghai
plugins:
- jekyll-feed
- jekyll-gist
- jekyll-paginate
- jekyll-sitemap
- jekyll-redirect-from
- jemoji
whitelist:
- jekyll-feed
- jekyll-gist
- jekyll-paginate
- jekyll-sitemap
- jekyll-redirect-from
- jemoji
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
compress_html:
  clippings: all
  ignore:
    envs: development
