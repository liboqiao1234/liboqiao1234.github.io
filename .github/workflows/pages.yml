name: Build and deploy academic site
on:
  push:
    branches: [main, academic-redesign]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local writing and publishing tools
        run: python3 -m unittest discover -s tests -v
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build Jekyll
        run: bundle exec jekyll build --strict_front_matter --trace
        env:
          JEKYLL_ENV: production
      - name: Check preserved blog and generated pages
        run: python3 scripts/check_site.py _site
      - name: Save homepage and blog preview
        uses: actions/upload-artifact@v4
        with:
          name: homepage-preview
          retention-days: 7
          path: |
            _site/index.html
            _site/blog/index.html
            _site/assets/css/
            _site/assets/fonts/
            _site/assets/webfonts/
            _site/assets/js/main.min.js
            _site/assets/js/blog-search.js
            _site/images/profile.jpg
            _site/images/favicon*
            _site/images/apple-touch-icon-180x180.png
            _site/images/manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
